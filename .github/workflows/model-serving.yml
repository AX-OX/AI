name: Model serving

on:
  pull_request:
    branches: [develop]
    paths:
      - model-serving/**
      - .github/workflows/model-serving.yml
  push:
    branches: [develop]
    paths:
      - model-serving/**
      - .github/workflows/model-serving.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: model-serving/requirements.txt
      - name: Install and test standalone server
        working-directory: model-serving
        run: |
          pip install -r requirements.txt pytest httpx
          python -m pytest tests -q
          docker compose config --quiet
