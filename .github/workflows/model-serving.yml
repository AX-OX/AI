name: Model serving

on:
  pull_request:
    branches: [develop]
    paths:
      - model-serving/**
      - agent/**
      - ops/monitoring/**
      - Dockerfile
      - cloudbuild.vm.yaml
      - .github/workflows/model-serving.yml
  push:
    branches: [develop]
    paths:
      - model-serving/**
      - agent/**
      - ops/monitoring/**
      - Dockerfile
      - cloudbuild.vm.yaml
      - .github/workflows/model-serving.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: model-serving/requirements.txt
      - name: Install and test standalone server
        working-directory: model-serving
        run: |
          pip install -r requirements.txt pytest httpx
          python -m pytest tests -q
          docker compose config --quiet
      - name: Validate alert rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/model-serving/monitoring:/rules:ro" \
            -w /rules prom/prometheus:v3.15.1 test rules alerts.test.yml
      - name: Validate production monitoring and recovery
        run: |
          SITE_ADDRESS=axox.example.test AI_IMAGE=validation-only docker compose -f ops/monitoring/compose.yaml config --quiet
          python -m pytest ops/monitoring/test_install.py -q
          docker run --rm --entrypoint promtool \
            -v "$PWD/ops/monitoring/alerts.yml:/rules.yml:ro" \
            prom/prometheus:v3.15.1 check rules /rules.yml
      - name: Install and test Agent instrumentation
        run: |
          pip install -r agent/requirements.lock.txt pytest pytest-asyncio
          python -m pytest agent/tests/test_telemetry.py agent/tests/test_api.py agent/tests/test_conversation.py agent/tests/test_llm_demo.py agent/tests/test_external_research.py -q
