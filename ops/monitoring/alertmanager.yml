global:
  resolve_timeout: 1m
route:
  receiver: persisted-inbox
  group_by: [alertname, job]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
receivers:
  - name: persisted-inbox
    webhook_configs:
      - url: http://alert-inbox:8000/webhook
        send_resolved: true
        max_alerts: 20
