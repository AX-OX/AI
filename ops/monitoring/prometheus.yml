global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production
    service: axox

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: ax-agent
    scrape_timeout: 5s
    sample_limit: 10000
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics-token
    static_configs:
      - targets: [agent:8000]
        labels:
          environment: production

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
