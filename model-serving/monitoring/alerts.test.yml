rule_files:
  - alerts.yml
evaluation_interval: 5s
tests:
  - name: server down fires after 15 seconds
    interval: 5s
    input_series:
      - series: 'up{job="iris-model",instance="model:8000"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 20s
        alertname: ServingTargetDown
        exp_alerts:
          - exp_labels:
              job: iris-model
              instance: model:8000
              severity: critical
            exp_annotations:
              summary: iris-model server is unreachable
  - name: invalid client requests are not server failures
    interval: 5s
    input_series:
      - series: 'model_prediction_requests_total{job="iris-model",status="422"}'
        values: '0+10x30'
      - series: 'model_prediction_requests_total{job="iris-model",status="503"}'
        values: '0+0x30'
    alert_rule_test:
      - eval_time: 1m
        alertname: ModelHighErrorRatio
        exp_alerts: []
  - name: sustained server errors notify
    interval: 5s
    input_series:
      - series: 'model_prediction_requests_total{job="iris-model",status="200"}'
        values: '0+5x30'
      - series: 'model_prediction_requests_total{job="iris-model",status="503"}'
        values: '0+5x30'
    alert_rule_test:
      - eval_time: 1m
        alertname: ModelHighErrorRatio
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Iris server errors exceed 10% (at least 10 requests/min)
