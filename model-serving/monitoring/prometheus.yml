global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: iris-model
    static_configs:
      - targets: ["model:8000"]
  - job_name: ax-agent
    authorization:
      type: Bearer
      credentials: local-metrics-demo-only
    static_configs:
      - targets: ["agent:8000"]
