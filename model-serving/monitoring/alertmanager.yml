global:
  resolve_timeout: 30s
route:
  receiver: local-inbox
  group_by: [alertname, job]
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 4h
receivers:
  - name: local-inbox
    webhook_configs:
      - url: http://alert-inbox:8000/webhook
        send_resolved: true
        max_alerts: 20
